<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DC DeckBuilder</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { height: 100%; overflow: hidden; background: #04060c; }

  /* Option A — "fit to screen": fixed 1600x900 design canvas, uniformly scaled (see scaler after <body>). */
  body {
    width: 1600px;
    height: 900px;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%); /* JS refines this to add scale(s) */
    transform-origin: center center;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background-color: #04060c;
    background-image: url("background.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* Scrim so menu text stays readable over the box art */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(to top, rgba(3,5,10,0.78) 0%, rgba(3,5,10,0.34) 16%, transparent 40%),
      radial-gradient(ellipse 130% 95% at 50% 42%, rgba(3,5,10,0.14) 0%, rgba(3,5,10,0.42) 72%, rgba(3,5,10,0.8) 100%);
  }

  .title {
    z-index: 1;
    position: relative;
    font-size: 6.5rem; /* was clamp(3rem,9vw,6.5rem) — fixed for the 1600x900 design */
    font-weight: 900;
    letter-spacing: 0.04em;
    line-height: 1;
    text-align: center;
    color: #fff;
    margin-bottom: 3.8rem; /* was clamp(2.2rem,7vh,3.8rem) — fixed for the 1600x900 design */
    text-shadow:
      0 2px 6px rgba(0,0,0,0.85),
      0 0 16px rgba(255, 45, 60, 0.50),
      0 0 44px rgba(255, 45, 60, 0.28);
  }

  .title .dc {
    color: #ff2d3c;
    text-shadow:
      0 2px 6px rgba(0,0,0,0.85),
      0 0 22px rgba(255, 45, 60, 0.75),
      0 0 58px rgba(255, 45, 60, 0.38);
  }

  .menu {
    z-index: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
    align-items: center;
  }

  .btn {
    width: 320px; /* was min(320px,78vw) — fixed for the 1600x900 design */
    padding: 0.95rem 1rem;
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #fff;
    text-align: center;
    background: linear-gradient(180deg, rgba(42,51,72,0.96), rgba(21,28,45,0.96));
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }

  .btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.25);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
  }

  .btn:focus-visible {
    outline: 2px solid #ff2d3c;
    outline-offset: 3px;
  }

  a.btn {
    text-decoration: none;
  }

  .btn-primary {
    background: linear-gradient(180deg, rgba(164,22,34,0.97), rgba(110,15,25,0.97));
    border-color: rgba(255, 120, 130, 0.5);
    box-shadow: 0 0 22px rgba(255, 45, 60, 0.3);
  }

  .legal {
    position: absolute;
    bottom: 1.1rem;
    left: 0;
    right: 0;
    z-index: 1;
    text-align: center;
    padding: 0 1rem;
    font-size: 0.72rem;
    line-height: 1.55;
    letter-spacing: 0.03em;
    color: rgba(255, 255, 255, 0.8);
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>
<script>
/* Option A scaler: fit the fixed 1600x900 design canvas into any viewport (contain/letterbox).
   Everything inside <body> scales as one unit, so it looks identical on every monitor/resolution. */
(function () {
  var DW = 1600, DH = 900;
  function fit() {
    // Contain: uniform scale to fit the design inside any screen (letterbox bars on non-16:9).
    var s = Math.min(window.innerWidth / DW, window.innerHeight / DH);
    document.body.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  fit();
  window.addEventListener('resize', fit);
})();
</script>

  <h1 class="title"><span class="dc">DC</span> DECKBUILDER</h1>

  <nav class="menu" aria-label="Main menu">
    <button class="btn btn-primary" type="button" id="startBtn">Start game</button>
  </nav>


  <footer class="legal">
    DC UNIVERSE and all related characters and elements are trademarks of and © DC Comics.<br />
    Cryptozoic.
  </footer>

<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.search);
  var room = (q.get('room') || '').trim();
  if (room) {
    // Opened via a shared link -> drop straight into that room as a guest.
    document.getElementById('startBtn').textContent = 'Joining…';
    location.replace('lobby.html?role=guest&room=' + encodeURIComponent(room));
    return;
  }
  function newRoomId() {
    var s = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', out = '';
    for (var i = 0; i < 6; i++) out += s.charAt(Math.floor(Math.random() * s.length));
    return out;
  }
  document.getElementById('startBtn').addEventListener('click', function () {
    location.href = 'lobby.html?role=host&room=' + newRoomId();
  });

})();
</script>

</body>
</html>
